<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(20,20)">
    <!-- Rounded square -->
    <rect x="0" y="0" width="77" height="72" rx="16" fill="url(#grad)"/>

    <!-- Stylized N -->
    <path d="M18 54
             L18 18
             L34 18
             L54 48
             L54 18
             L62 18
             L62 54
             L46 54
             L26 24
             L26 54 Z"
          fill="white"/>

    <!-- Growth arrow -->
    <polyline points="16,48 30,40 40,44 58,24"
              fill="none"
              stroke="#A7F3D0"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"/>
    <polygon points="58,24 51,24 58,17 65,24"
             fill="#A7F3D0"/>
  </g>

  <!-- Brand Name -->
  <text x="115" y="55"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="38"
        font-weight="700"
        fill="#111827">
    Nex<tspan fill="#2563EB">Vest</tspan>
  </text>

  <!-- Tagline -->
  <text x="116" y="82"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="15"
        letter-spacing="0.5"
        fill="#6B7280">
    Modern investing, reimagined.
  </text>
</svg>
